name: Release

# Builds the installers on a Windows and a Linux machine.
#   - Pushing a tag such as v0.1.0 publishes them in a draft release.
#   - A pull request that changes the packaging builds them as test files,
#     downloadable from the run's page, without publishing anything.
#   - "Run workflow" on the Actions tab does the same by hand.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "backend/backend.spec"
      - "backend/requirements.txt"
      - "backend/main.py"
      - "backend/settings.py"
      - "backend/generation/runtime.py"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src-tauri/**"
  workflow_dispatch:

jobs:
  build:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # The oldest supported Ubuntu, so the result also runs on newer ones.
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build the backend executable
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller backend.spec --noconfirm

      # Tauri looks for the backend under a name ending in the platform, such
      # as backend-x86_64-pc-windows-msvc.exe.
      - name: Place the backend for the app
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            ext=".exe"
          fi
          mkdir -p frontend/src-tauri/binaries
          cp "backend/dist/backend$ext" "frontend/src-tauri/binaries/backend-$triple$ext"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the frontend's packages
        working-directory: frontend
        run: npm ci

      - name: Build the installers and publish a draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: xref-rag ${{ github.ref_name }}
          releaseDraft: true

      - name: Build the installers
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Keep the test installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: xref-rag-${{ runner.os }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
